version: "3.9"

# Ambiente local: PostgreSQL + Redis + pgAdmin + aplicacao Spring Boot.

networks:
  concursos-net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  pgadmin_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: concursos-postgres
    environment:
      POSTGRES_DB: concursos
      POSTGRES_USER: concursos
      POSTGRES_PASSWORD: concursos
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - concursos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concursos -d concursos"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: concursos-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - concursos-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: concursos-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@questoesaprova.local
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - concursos-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: concursos-app
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: concursos
      DB_USER: concursos
      DB_PASS: concursos
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-256bits-mude-em-producao}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - concursos-net
    restart: unless-stopped
