spring.application.name=questoes-aprova

# Banco de Dados PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:concursos}
spring.datasource.username=${DB_USER:concursos}
spring.datasource.password=${DB_PASS:concursos}
spring.datasource.driver-class-name=org.postgresql.Driver

# Redis usado para cache das explicacoes de IA
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Flyway controla a versao do schema do banco
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT stateless
jwt.secret=${JWT_SECRET:dev-secret-256bits-mude-em-producao}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# LangChain4j/OpenAI
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}

# Swagger e Actuator
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
